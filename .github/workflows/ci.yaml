name: ci

on:
  push:
    branches:
      - ios-custom-build
      - codex/ffmpeg-8.1.3
    tags:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  ci:
    name: iOS universal video-default
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Platform info
        run: |
          printf "%-23s %s\n" "ProductName:"    "$(/usr/bin/sw_vers -productName)"
          printf "%-23s %s\n" "ProductVersion:" "$(/usr/bin/sw_vers -productVersion)"
          printf "%-23s %s\n" "BuildVersion:"   "$(/usr/bin/sw_vers -buildVersion)"
          printf "%-23s %s\n" "Arch:"           "$(uname -m)"

      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - name: Show Nix config
        run: nix config show

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Xcode path
        id: xcode_path
        run: |
          XCODE_PATH=$(realpath /Applications/Xcode_26.6.app)
          "${XCODE_PATH}/Contents/Developer/usr/bin/xcodebuild" -version
          echo "xcode_path=${XCODE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build iOS universal video-default
        env:
          XCODE_PATH: ${{ steps.xcode_path.outputs.xcode_path }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.2.1' }}
        run: |
          nix develop -c make \
            XCODE_PATH="${XCODE_PATH}" \
            VERSION="${VERSION}" \
            TARGET=mk-out-archive-xcframeworks-ios-universal-video-default

      - name: Inspect artifact size
        run: |
          ls -lh result/libmpv-xcframeworks_*_ios-universal-video-default.tar.gz
          shasum -a 256 result/libmpv-xcframeworks_*_ios-universal-video-default.tar.gz

      - name: Verify AV1 VideoToolbox
        run: |
          mkdir -p "${RUNNER_TEMP}/libmpv"
          tar -xzf result/libmpv-xcframeworks_*_ios-universal-video-default.tar.gz \
            -C "${RUNNER_TEMP}/libmpv"
          find "${RUNNER_TEMP}/libmpv" -path '*/Avcodec.framework/Avcodec' \
            -exec strings {} \; | grep -q av1_videotoolbox

      - name: Verify FFmpeg version
        run: |
          find "${RUNNER_TEMP}/libmpv" -path '*/Avutil.framework/Avutil' -print0 |
            while IFS= read -r -d '' library; do
              strings "${library}" | grep -F 'FFmpeg version 8.1.3'
            done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-xcframeworks-ios-universal-video-default
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: result/libmpv-xcframeworks_*_ios-universal-video-default.tar.gz

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: result/libmpv-xcframeworks_*_ios-universal-video-default.tar.gz
